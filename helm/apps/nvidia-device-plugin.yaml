apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvidia-device-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://nvidia.github.io/k8s-device-plugin
    chart: nvidia-device-plugin
    targetRevision: 0.17.1
    helm:
      values: |
        gfd:
          enabled: true
        # Time-slice the single RTX 4070 so it advertises 4 schedulable
        # nvidia.com/gpu units instead of 1. Without this, a long-running
        # Jellyfin pod holding nvidia.com/gpu:1 would permanently reserve the
        # only GPU and leave JupyterHub GPU notebooks Pending forever.
        # Trade-off: slices share VRAM with no hard isolation (fine for a
        # single-user homelab; a heavy training job + a 4K transcode could
        # still contend for the 12GB).
        config:
          default: shared
          map:
            shared: |-
              version: v1
              sharing:
                timeSlicing:
                  resources:
                    - name: nvidia.com/gpu
                      replicas: 4
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
