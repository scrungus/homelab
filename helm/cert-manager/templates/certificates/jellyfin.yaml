apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jellyfin-cert
  namespace: jellyfin
spec:
  secretName: jellyfin-tls
  duration: 8760h
  renewBefore: 720h
  dnsNames:
    - jellyfin.lab
  usages:
    - server auth
    - client auth
  issuerRef:
    name: homelab-issuer
    kind: ClusterIssuer
    group: cert-manager.io
