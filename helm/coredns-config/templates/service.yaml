apiVersion: v1
kind: Service
metadata:
  name: coredns-custom
spec:
  type: NodePort
  # Let Tailscale nameservers use the normal DNS port without changing
  # the existing NodePort used by manually configured clients.
  externalIPs:
    - 100.66.242.14
  ports:
    - name: dns
      port: 53
      targetPort: 53
      protocol: UDP
      nodePort: 32053
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
      nodePort: 32053
  selector:
    k8s-app: kube-dns
