apiVersion: v1
kind: Service
metadata:
  name: house-map
spec:
  ports:
    - name: http
      port: {{ .Values.port }}
      targetPort: {{ .Values.port }}
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: house-map
subsets:
  - addresses:
      - ip: {{ .Values.truenasAddress | quote }}
    ports:
      - name: http
        port: {{ .Values.port }}
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: house-map
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: house-map
                port:
                  name: http
