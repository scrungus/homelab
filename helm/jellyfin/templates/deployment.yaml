apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
        - name: jellyfin
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8096
              protocol: TCP
          env:
            - name: PUID
              valueFrom:
                secretKeyRef:
                  name: user-id-secret
                  key: USER_ID
            - name: PGID
              valueFrom:
                secretKeyRef:
                  name: user-id-secret
                  key: USER_ID
            - name: TZ
              value: {{ .Values.environment.TZ | quote }}
          {{- if .Values.gpu.enabled }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "all"
          {{- end }}
          {{- if .Values.gpu.enabled }}
          resources:
            limits:
              nvidia.com/gpu: 1
          {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8096
            initialDelaySeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8096
            periodSeconds: 25
            initialDelaySeconds: 20
            timeoutSeconds: 10
            failureThreshold: 10
          volumeMounts:
            - name: config
              mountPath: /config
            - name: anime
              mountPath: /media/Anime
              readOnly: true
            - name: animefilms
              mountPath: /media/AnimeFilms
              readOnly: true
            - name: homemedia
              mountPath: /media/HomeMedia
              readOnly: true
            - name: movies
              mountPath: /media/Movies
              readOnly: true
            - name: music
              mountPath: /media/Music
              readOnly: true
            - name: shortfilms
              mountPath: /media/ShortFilms
              readOnly: true
            - name: tvseries
              mountPath: /media/TVSeries
              readOnly: true
            - name: documentaries
              mountPath: /media/Documentaries
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: anime
          hostPath:
            path: {{ .Values.persistence.media.anime.path }}
        - name: animefilms
          hostPath:
            path: {{ .Values.persistence.media.animeFilms.path }}
        - name: homemedia
          hostPath:
            path: {{ .Values.persistence.media.homeMedia.path }}
        - name: movies
          hostPath:
            path: {{ .Values.persistence.media.movies.path }}
        - name: music
          hostPath:
            path: {{ .Values.persistence.media.music.path }}
        - name: shortfilms
          hostPath:
            path: {{ .Values.persistence.media.shortFilms.path }}
        - name: tvseries
          hostPath:
            path: {{ .Values.persistence.media.tvSeries.path }}
        - name: documentaries
          hostPath:
            path: {{ .Values.persistence.media.documentaries.path }}
