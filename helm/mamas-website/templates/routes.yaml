{{- range .Values.apps }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
spec:
  ports:
    - name: http
      port: {{ .port }}
      targetPort: {{ .port }}
      protocol: TCP
---
apiVersion: v1
kind: Endpoints
metadata:
  name: {{ .name }}
subsets:
  - addresses:
      - ip: {{ $.Values.truenasAddress | quote }}
    ports:
      - name: http
        port: {{ .port }}
        protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .name }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    {{- if .rootRedirect }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-%s-root@kubernetescrd" $.Release.Namespace .name | quote }}
    {{- end }}
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .name }}
                port:
                  name: http
{{- if .rootRedirect }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .name }}-root
spec:
  redirectRegex:
    regex: '^http://([^/]+)/?$'
    replacement: {{ printf "http://${1}%s" .rootRedirect | quote }}
    permanent: false
{{- end }}
{{- end }}
