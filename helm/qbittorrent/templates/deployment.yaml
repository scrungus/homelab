apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
spec:
  replicas: 1
  # Recreate (not RollingUpdate): the config lives on a single-node RWO/hostPath
  # volume, so an old and new pod must never overlap — otherwise the terminating
  # old qBittorrent writes its in-memory config back to disk and clobbers the
  # config-init edits (AutoRun/AutoTMM) the new pod just made.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      initContainers:
      # Declaratively configure AutoRun + AutoTMM + library categories before
      # qBittorrent starts, so the auto-file-into-library behaviour lives in git
      # rather than in WebUI clicks.
      - name: config-init
        image: busybox:1.36
        command: ["sh", "/hooks-src/init.sh"]
        env:
          - name: PUID
            valueFrom:
              secretKeyRef:
                name: user-id-secret
                key: USER_ID
          - name: PGID
            valueFrom:
              secretKeyRef:
                name: user-id-secret
                key: USER_ID
        volumeMounts:
        - name: config
          mountPath: /config
        - name: hooks
          mountPath: /hooks-src
      containers:
      - name: qbittorrent
        image: lscr.io/linuxserver/qbittorrent:latest
        env:
          - name: PUID
            valueFrom:
              secretKeyRef:
                name: user-id-secret
                key: USER_ID
          - name: PGID
            valueFrom:
              secretKeyRef:
                name: user-id-secret
                key: USER_ID
          - name: TZ
            value: "Etc/UTC"
          - name: WEBUI_PORT
            value: "8080"
          - name: TORRENTING_PORT
            value: "6881"
        ports:
        - containerPort: 8080
          name: webui
        - containerPort: 6881
          name: torrenting
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /config
        - name: downloads
          mountPath: /downloads
        - name: media
          mountPath: /media
        - name: hooks
          mountPath: /hooks
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: qbittorrent-config
      - name: downloads
        persistentVolumeClaim:
          claimName: qbittorrent-downloads
      # The library root, so a completed torrent in category "tv" lands in
      # /media/TVSeries (= /tank/Media/TVSeries), the same dir Plex/Jellyfin read.
      - name: media
        hostPath:
          path: /tank/Media
      - name: hooks
        configMap:
          name: qbittorrent-hooks
          defaultMode: 0755